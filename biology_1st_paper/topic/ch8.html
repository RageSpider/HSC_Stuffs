<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>অধ্যায় ৮: টিস্যু ও টিস্যুতন্ত্র | জীববিজ্ঞান ১ম পত্র</title>
    
    <!-- Fonts: Elegant Academic English + Bangla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.maateen.me/bangla/font.css" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../topic-css/ch8.css">
</head>
<body class="histology-bg">
    
    <div id="navbar-placeholder"></div>

    <main class="chapter-main">
        <!-- Plant Histology Hero Section -->
        <header class="ch-hero">
            <div class="ch-hero-overlay"></div>
            <div class="ch-hero-content">
                <div class="ch-badge bn-text cell-wall-border"><i data-lucide="layers"></i> প্ল্যান্ট হিস্টোলজি গাইড</div>
                <h1 class="ch-title bn-text">টিস্যু ও টিস্যুতন্ত্র</h1>
                <p class="ch-subtitle bn-text">
                    ভাজক টিস্যু, স্থায়ী টিস্যু এবং এপিডার্মাল, গ্রাউন্ড ও ভাস্কুলার টিস্যুতন্ত্রের অভ্যন্তরীণ গঠনের মাইক্রোস্কোপিক বিশ্লেষণ।
                </p>
            </div>
        </header>

        <!-- Cell Wall Segmented Tabs Navigation -->
        <section class="ch-nav-section">
            <div class="tabs-wrapper">
                <button class="tab-btn active bn-text" data-tab="lecture"><i data-lucide="microscope"></i> লেকচার স্লাইড</button>
                <button class="tab-btn bn-text" data-tab="mcq"><i data-lucide="grid-3x3"></i> টিস্যু ডাটাবেস</button>
                <button class="tab-btn bn-text" data-tab="cq"><i data-lucide="align-justify"></i> সৃজনশীল বিশ্লেষণ</button>
            </div>
        </section>

        <section class="ch-content-section">
            
            <!-- 1. LECTURE TAB -->
            <div class="tab-content active" id="lecture-tab">
                
                <!-- TOP Pagination -->
                <div class="lecture-pagination bn-text" style="margin-top: 0; margin-bottom: 20px;">
                    <button class="page-btn btn-prev bn-text cell-wall-border" disabled><i data-lucide="arrow-left"></i> পূর্ববর্তী স্লাইড</button>
                    <div class="page-indicator cell-wall-border">স্তর <span class="current-page-num en-text">1</span> / <span class="total-page-num en-text">--</span></div>
                    <button class="page-btn btn-next bn-text cell-wall-border">পরবর্তী স্লাইড <i data-lucide="arrow-right"></i></button>
                </div>

                <div class="academic-card cell-layer">
                    <div class="lecture-header">
                        <h3 id="lecture-page-title" class="bn-text">মাইক্রোস্কোপ লোডিং...</h3>
                    </div>
                    <div class="lecture-viewer bn-text" id="lecture-viewer">
                        <div class="loader"><i data-lucide="loader-2" class="spin"></i> কোষ বিভাজন চলছে...</div>
                    </div>
                </div>
                
                <!-- BOTTOM Pagination -->
                <div class="lecture-pagination bn-text">
                    <button class="page-btn btn-prev bn-text cell-wall-border" disabled><i data-lucide="arrow-left"></i> পূর্ববর্তী স্লাইড</button>
                    <div class="page-indicator cell-wall-border">স্তর <span class="current-page-num en-text">1</span> / <span class="total-page-num en-text">--</span></div>
                    <button class="page-btn btn-next bn-text cell-wall-border">পরবর্তী স্লাইড <i data-lucide="arrow-right"></i></button>
                </div>
            </div>

            <!-- 2. MCQ TAB -->
            <div class="tab-content" id="mcq-tab">
                <!-- Concentric Filter Toolbar -->
                <div class="filter-toolbar cell-layer">
                    <div class="search-box">
                        <i data-lucide="search"></i>
                        <input type="text" id="mcq-search" class="bn-text cell-wall-border" placeholder="এমসিকিউ টিস্যু স্ক্যান করুন...">
                    </div>
                    <div class="filters-grid">
                        <select id="mcq-board-filter" class="bn-text cell-wall-border"><option value="all">সব সোর্স</option></select>
                        <select id="mcq-year-filter" class="bn-text cell-wall-border"><option value="all">সব সাল</option></select>
                        <select id="mcq-type-filter" class="bn-text cell-wall-border"><option value="all">সব টপিক</option></select>
                        <select id="mcq-mode-select" class="bn-text cell-wall-border">
                            <option value="study">স্টাডি মোড (দৃশ্যমান)</option>
                            <option value="exam">এক্সাম মোড (লুকানো)</option>
                        </select>
                    </div>
                </div>
                
                <div id="dynamic-mcq-container" class="bn-text"></div>
            </div>

            <!-- 3. CQ TAB -->
            <div class="tab-content" id="cq-tab">
                <!-- Concentric Sub Tabs for CQ -->
                <div class="cq-sub-tabs-wrapper">
                    <button class="cq-sub-tab-btn active bn-text cell-wall-border" data-cq="ka">জ্ঞানমূলক (ক)</button>
                    <button class="cq-sub-tab-btn bn-text cell-wall-border" data-cq="kha">অনুধাবন (খ)</button>
                    <button class="cq-sub-tab-btn bn-text cell-wall-border" data-cq="ga-gha">প্রয়োগ ও উচ্চতর (গ-ঘ)</button>
                </div>

                <!-- Concentric Filter Toolbar -->
                <div class="filter-toolbar cell-layer">
                    <div class="search-box">
                        <i data-lucide="search"></i>
                        <input type="text" id="cq-search" class="bn-text cell-wall-border" placeholder="সৃজনশীল কোষ খুঁজুন...">
                    </div>
                    <div class="filters-grid">
                        <select id="cq-board-filter" class="bn-text cell-wall-border"><option value="all">সব সোর্স</option></select>
                        <select id="cq-year-filter" class="bn-text cell-wall-border"><option value="all">সব সাল</option></select>
                        <select id="cq-type-filter" class="bn-text cell-wall-border"><option value="all">সব টপিক</option></select>
                    </div>
                </div>

                <div id="cq-container" class="bn-text"></div>
            </div>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/include-navbar.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/include-footer.js"></script>
    <script src="../js/footer.js"></script>
    
    <script src="../topic-js/ch8.js"></script>
    <script src="../topic-data/ch8/scripts/mcq-function.js"></script>
    <script src="../topic-data/ch8/scripts/cq-function.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অধ্যায় ০২: ভেক্টর | Physics Master Guide</title>
    
    <link href="https://fonts.maateen.me/bangla/font.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MathJax Configuration for LaTeX Rendering -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <!-- Base Styles + Chapter Override -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../topic-css/ch2.css">
</head>
<body class="bn-text">
    
    <div id="navbar-placeholder"></div>

    <main>
        <section class="ch2-hero">
            <!-- Isometric 3D Vector Space Background -->
            <div class="vector-space-bg">
                <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Glowing Filters -->
                        <filter id="pink-glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="indigo-glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Arrowheads -->
                        <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--primary-color)" />
                        </marker>
                        <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent-color)" />
                        </marker>

                        <!-- Isometric Grid Pattern -->
                        <pattern id="iso-grid" width="60" height="34.64" patternUnits="userSpaceOnUse" patternTransform="scale(1.5)">
                            <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="var(--primary-color)" stroke-width="0.5" class="grid-opacity" />
                        </pattern>
                    </defs>

                    <!-- Background Grid -->
                    <rect x="-50%" y="-50%" width="200%" height="200%" fill="url(#iso-grid)" class="animated-grid" />

                    <!-- Abstract 3D Vector Representation (Centered) -->
                    <g transform="translate(500, 250)">
                        
                        <!-- Coordinate Axes -->
                        <line x1="0" y1="0" x2="-250" y2="144" stroke="var(--primary-color)" stroke-width="1" class="axis-opacity" stroke-dasharray="5 5" />
                        <line x1="0" y1="0" x2="250" y2="144" stroke="var(--primary-color)" stroke-width="1" class="axis-opacity" stroke-dasharray="5 5" />
                        <line x1="0" y1="0" x2="0" y2="-200" stroke="var(--primary-color)" stroke-width="1" class="axis-opacity" stroke-dasharray="5 5" />

                        <!-- Plane of Vector A and B -->
                        <polygon points="0,0 -150,86.6 50,144.3 200,57.7" fill="var(--primary-color)" class="plane-opacity" />

                        <!-- Vector A -->
                        <line x1="0" y1="0" x2="-150" y2="86.6" stroke="var(--primary-color)" stroke-width="4" marker-end="url(#arrow-indigo)" filter="url(#indigo-glow)" />
                        <text x="-170" y="100" fill="var(--primary-color)" font-family="sans-serif" font-weight="bold" font-size="16">A</text>
                        
                        <!-- Vector B -->
                        <line x1="0" y1="0" x2="200" y2="57.7" stroke="var(--primary-color)" stroke-width="4" marker-end="url(#arrow-indigo)" filter="url(#indigo-glow)" />
                        <text x="215" y="70" fill="var(--primary-color)" font-family="sans-serif" font-weight="bold" font-size="16">B</text>

                        <!-- Parallelogram completion lines -->
                        <line x1="-150" y1="86.6" x2="50" y2="144.3" stroke="var(--primary-color)" stroke-width="2" stroke-dasharray="6 4" class="axis-opacity" />
                        <line x1="200" y1="57.7" x2="50" y2="144.3" stroke="var(--primary-color)" stroke-width="2" stroke-dasharray="6 4" class="axis-opacity" />

                        <!-- Cross Product Vector C = A x B (Pulsing upwards) -->
                        <g class="cross-product-vector">
                            <line x1="0" y1="0" x2="0" y2="-180" stroke="var(--accent-color)" stroke-width="5" marker-end="url(#arrow-pink)" filter="url(#pink-glow)" />
                            <text x="15" y="-180" fill="var(--accent-color)" font-family="sans-serif" font-weight="bold" font-size="18" filter="url(#pink-glow)">A × B</text>
                        </g>

                    </g>
                </svg>
            </div>

            <div class="container relative z-10">
                <div class="ch2-subtitle bn-text"><i data-lucide="move-up-right"></i> অধ্যায় ০২</div>
                <h1 class="ch2-title bn-text">ভেক্টর</h1>
                <p class="bn-text ch2-hero-desc">
                    ভেক্টর বীজগণিত, সামান্তরিক সূত্র, ডট ও ক্রস গুণন, আপেক্ষিক বেগ এবং নদী-নৌকার গাণিতিক বিশ্লেষণ।
                </p>
            </div>
        </section>

        <section class="container" style="min-height: 60vh;">
            <div class="tab-container">
                <div class="tabs">
                    <button class="tab-btn active bn-text" data-tab="tab-formulas">
                        <i data-lucide="sigma"></i> প্রয়োজনীয় সূত্রাবলি
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-mcq">
                        <i data-lucide="check-square"></i> ডাইনামিক MCQ
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-cq">
                        <i data-lucide="pen-tool"></i> সৃজনশীল প্রশ্ন (CQ)
                    </button>
                </div>

                <div id="tab-formulas" class="tab-content active">
                    <div id="formula-container" class="formula-grid">
                        <div style="text-align:center; padding: 20px; width: 100%;">লোড হচ্ছে...</div>
                    </div>
                </div>

                <div id="tab-mcq" class="tab-content">
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="mcq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="mcq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="mcq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="layers"></i> প্রশ্নের ধরন</label>
                                <select id="mcq-type-filter">
                                    <option value="all">সকল প্রশ্ন</option>
                                    <option value="static">বইয়ের প্রশ্ন</option>
                                    <option value="dynamic">মান পরিবর্তনশীল</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="book-open"></i> লার্নিং মোড</label>
                                <select id="mcq-mode-select">
                                    <option value="practice">প্র্যাকটিস মোড</option>
                                    <option value="teach">টিচিং মোড</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="list-ordered"></i> প্রশ্নের সিরিয়াল</label>
                                <select id="mcq-serial-select">
                                    <option value="json">বইয়ের সিরিয়াল</option>
                                    <option value="random">এলোমেলো</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="eye"></i> উত্তর প্রদর্শন</label>
                                <select id="mcq-answer-select">
                                    <option value="hide">ক্লিক করার পর দেখান</option>
                                    <option value="show">সব উত্তর আগেই দেখান</option>
                                </select>
                            </div>
                        </div>
                        <div class="mcq-controls">
                            <button id="regen-mcq-btn" class="action-btn bn-text">
                                <i data-lucide="refresh-cw"></i> নতুন সেট তৈরি করুন
                            </button>
                        </div>
                    </div>
                    <div id="dynamic-mcq-container"></div>
                </div>

                <div id="tab-cq" class="tab-content">
                    <div class="cq-sub-tabs">
                        <button class="cq-sub-tab-btn active bn-text" data-cq="ka">জ্ঞানমূলক (ক)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="kha">অনুধাবনমূলক (খ)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="ga-gha">প্রয়োগ ও উচ্চতর (গ, ঘ)</button>
                    </div>
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="cq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="cq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="cq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="tag"></i> টপিক ফিল্টার</label>
                                <select id="cq-type-filter"><option value="all">সকল টপিক</option></select>
                            </div>
                        </div>
                    </div>
                    <div id="cq-container">
                        <div style="text-align:center; padding: 20px;">লোড হচ্ছে...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="scroll-fab-container" id="scroll-controls">
        <button class="scroll-fab" id="scroll-top-btn" title="উপরে যান"><i data-lucide="arrow-up"></i></button>
        <button class="scroll-fab" id="scroll-bottom-btn" title="নিচে যান"><i data-lucide="arrow-down"></i></button>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/include-navbar.js"></script>
    <script src="../js/include-footer.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    
    <script src="../topic-js/topic-main.js"></script>
    <script src="../topic-data/ch2/scripts/mcq-generator.js"></script>
    <script src="../topic-data/shared/mcq-function.js"></script>
    <script src="../topic-data/shared/cq-function.js"></script>
</body>
</html>

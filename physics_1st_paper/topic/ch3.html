<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অধ্যায় ০৩: গতিবিদ্যা | Physics Master Guide</title>
    
    <link href="https://fonts.maateen.me/bangla/font.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MathJax Configuration for LaTeX Rendering -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <!-- Base Styles + Chapter Override -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../topic-css/ch3.css">
</head>
<body class="bn-text">
    
    <div id="navbar-placeholder"></div>

    <main>
        <section class="ch3-hero">
            <!-- Cyber Kinematics HUD Background -->
            <div class="kinematics-hud-bg">
                <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Glowing Filter -->
                        <filter id="neon-glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <!-- HUD Grid Pattern -->
                        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--primary-color)" stroke-width="1" opacity="0.15"/>
                        </pattern>
                        <!-- Vector Arrowhead -->
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent-color)" />
                        </marker>
                    </defs>

                    <!-- Animated Background Grid -->
                    <rect width="100%" height="100%" fill="url(#grid-pattern)" class="hud-grid" />

                    <!-- X Axis -->
                    <line x1="0" y1="300" x2="1000" y2="300" stroke="var(--primary-color)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="15 5" />

                    <!-- The Mathematical Path (Complex Kinematic Curve) -->
                    <path id="motion-path" d="M -100 350 C 150 -100, 350 500, 650 150 S 900 -50, 1100 300" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-opacity="0.3" />

                    <!-- The Tracker Crosshairs (Translates to follow the path perfectly) -->
                    <g>
                        <!-- Vertical and Horizontal Laser Scanners -->
                        <line x1="-2000" y1="0" x2="2000" y2="0" stroke="var(--primary-color)" stroke-width="1" stroke-opacity="0.4" />
                        <line x1="0" y1="-2000" x2="0" y2="2000" stroke="var(--primary-color)" stroke-width="1" stroke-opacity="0.4" />
                        
                        <!-- Target Lock Box -->
                        <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="var(--accent-color)" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4 2" />
                        
                        <!-- Center Tracking Node -->
                        <circle cx="0" cy="0" r="6" fill="var(--bg-color)" stroke="var(--accent-color)" stroke-width="3" filter="url(#neon-glow)" />

                        <!-- HUD Data Label -->
                        <rect x="20" y="-40" width="95" height="26" rx="4" fill="var(--surface-color)" stroke="var(--primary-color)" stroke-opacity="0.6" />
                        <text x="28" y="-22" fill="var(--text-dark)" font-family="monospace" font-size="13" font-weight="bold">v = dx/dt</text>

                        <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear">
                            <mpath href="#motion-path" />
                        </animateMotion>
                    </g>

                    <!-- Tangent Velocity Vector (Rotates dynamically to hug the curve) -->
                    <g>
                        <!-- Velocity Arrow -->
                        <line x1="0" y1="0" x2="70" y2="0" stroke="var(--accent-color)" stroke-width="3" marker-end="url(#arrowhead)" filter="url(#neon-glow)" />
                        <!-- Velocity Label -->
                        <text x="75" y="-10" fill="var(--accent-color)" font-family="monospace" font-size="16" font-weight="bold">v(t)</text>

                        <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" rotate="auto">
                            <mpath href="#motion-path" />
                        </animateMotion>
                    </g>
                </svg>
            </div>

            <div class="container relative z-10">
                <div class="ch3-subtitle bn-text"><i data-lucide="navigation"></i> অধ্যায় ০৩</div>
                <h1 class="ch3-title bn-text">গতিবিদ্যা</h1>
                <p class="bn-text ch3-hero-desc">
                    প্রাস (Projectile), তাৎক্ষণিক বেগ, ত্বরণ এবং পরন্ত বস্তুর গতির গাণিতিক বিশ্লেষণ।
                </p>
            </div>
        </section>

        <section class="container" style="min-height: 60vh;">
            <div class="tab-container">
                <div class="tabs">
                    <button class="tab-btn active bn-text" data-tab="tab-formulas">
                        <i data-lucide="sigma"></i> প্রয়োজনীয় সূত্রাবলি
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-mcq">
                        <i data-lucide="check-square"></i> ডাইনামিক MCQ
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-cq">
                        <i data-lucide="pen-tool"></i> সৃজনশীল প্রশ্ন (CQ)
                    </button>
                </div>

                <div id="tab-formulas" class="tab-content active">
                    <div id="formula-container" class="formula-grid">
                        <div style="text-align:center; padding: 20px; width: 100%;">লোড হচ্ছে...</div>
                    </div>
                </div>

                <div id="tab-mcq" class="tab-content">
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="mcq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="mcq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="mcq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="layers"></i> প্রশ্নের ধরন</label>
                                <select id="mcq-type-filter">
                                    <option value="all">সকল প্রশ্ন</option>
                                    <option value="static">বইয়ের প্রশ্ন</option>
                                    <option value="dynamic">মান পরিবর্তনশীল</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="book-open"></i> লার্নিং মোড</label>
                                <select id="mcq-mode-select">
                                    <option value="practice">প্র্যাকটিস মোড</option>
                                    <option value="teach">টিচিং মোড</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="list-ordered"></i> প্রশ্নের সিরিয়াল</label>
                                <select id="mcq-serial-select">
                                    <option value="json">বইয়ের সিরিয়াল</option>
                                    <option value="random">এলোমেলো</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="eye"></i> উত্তর প্রদর্শন</label>
                                <select id="mcq-answer-select">
                                    <option value="hide">ক্লিক করার পর দেখান</option>
                                    <option value="show">সব উত্তর আগেই দেখান</option>
                                </select>
                            </div>
                        </div>
                        <div class="mcq-controls">
                            <button id="regen-mcq-btn" class="action-btn bn-text">
                                <i data-lucide="refresh-cw"></i> নতুন সেট তৈরি করুন
                            </button>
                        </div>
                    </div>
                    <div id="dynamic-mcq-container"></div>
                </div>

                <div id="tab-cq" class="tab-content">
                    <div class="cq-sub-tabs">
                        <button class="cq-sub-tab-btn active bn-text" data-cq="ka">জ্ঞানমূলক (ক)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="kha">অনুধাবনমূলক (খ)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="ga-gha">প্রয়োগ ও উচ্চতর (গ, ঘ)</button>
                    </div>
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="cq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="cq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="cq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="tag"></i> টপিক ফিল্টার</label>
                                <select id="cq-type-filter"><option value="all">সকল টপিক</option></select>
                            </div>
                        </div>
                    </div>
                    <div id="cq-container">
                        <div style="text-align:center; padding: 20px;">লোড হচ্ছে...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="scroll-fab-container" id="scroll-controls">
        <button class="scroll-fab" id="scroll-top-btn" title="উপরে যান"><i data-lucide="arrow-up"></i></button>
        <button class="scroll-fab" id="scroll-bottom-btn" title="নিচে যান"><i data-lucide="arrow-down"></i></button>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/include-navbar.js"></script>
    <script src="../js/include-footer.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    
    <script src="../topic-js/topic-main.js"></script>
    <script src="../topic-data/ch3/scripts/mcq-generator.js"></script>
    <script src="../topic-data/shared/mcq-function.js"></script>
    <script src="../topic-data/shared/cq-function.js"></script>
</body>
</html>

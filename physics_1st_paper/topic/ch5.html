<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অধ্যায় ০৫: কাজ, শক্তি ও ক্ষমতা | Physics Master Guide</title>
    
    <link href="https://fonts.maateen.me/bangla/font.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MathJax Configuration for LaTeX Rendering -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <!-- Base Styles + Chapter Override -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../topic-css/ch5.css">
</head>
<body class="bn-text">
    
    <div id="navbar-placeholder"></div>

    <main>
        <section class="ch5-hero">
            <!-- Industrial Hydraulic Pump Background -->
            <div class="hydraulic-pump-bg">
                <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Fluid Glow Filter -->
                        <filter id="water-glow">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <!-- Soil/Ground Texture -->
                        <pattern id="soil-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 0 10 L 40 30 M 10 0 L 30 40" stroke="var(--primary-color)" stroke-width="0.5" opacity="0.1" fill="none" />
                        </pattern>
                    </defs>

                    <!-- Background Elements -->
                    <!-- Ground Level -->
                    <rect x="0" y="250" width="1000" height="150" fill="var(--surface-hover)" opacity="0.5" />
                    <rect x="0" y="250" width="1000" height="150" fill="url(#soil-pattern)" />
                    <!-- Underground Well Hole -->
                    <rect x="700" y="250" width="120" height="150" fill="var(--bg-color)" />
                    
                    <!-- Water inside the well -->
                    <rect x="700" y="300" width="120" height="100" fill="var(--accent-color)" opacity="0.3" />
                    <!-- Animated Well Water Surface -->
                    <path class="water-surface" d="M 700 300 Q 730 290 760 300 T 820 300" fill="none" stroke="var(--accent-color)" stroke-width="2" filter="url(#water-glow)"/>

                    <!-- Pump Infrastructure -->
                    <!-- Main Vertical Pipe -->
                    <path d="M 760 380 L 760 150 L 580 150 L 580 200" fill="none" stroke="var(--text-gray)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
                    <path id="pipe-core" d="M 760 380 L 760 150 L 580 150 L 580 200" fill="none" stroke="var(--primary-color)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Animated Fluid Flow inside the pipe -->
                    <path class="fluid-flow" d="M 760 380 L 760 150 L 580 150 L 580 200" fill="none" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20 15" filter="url(#water-glow)" />

                    <!-- Motor / Pump Engine -->
                    <g transform="translate(730, 110)">
                        <!-- Engine Block -->
                        <rect x="0" y="0" width="60" height="60" rx="8" fill="var(--surface-color)" stroke="var(--primary-color)" stroke-width="4" />
                        <rect x="15" y="-10" width="30" height="10" rx="2" fill="var(--primary-color)" />
                        <!-- Spinning Gear -->
                        <circle cx="30" cy="30" r="16" fill="none" stroke="var(--primary-hover)" stroke-width="6" stroke-dasharray="10 6" class="motor-spin" />
                        <circle cx="30" cy="30" r="4" fill="var(--primary-color)" />
                    </g>

                    <!-- Discharge / Collection Tank -->
                    <rect x="520" y="240" width="120" height="50" fill="var(--surface-color)" stroke="var(--primary-color)" stroke-width="3" rx="4" />
                    <rect x="520" y="260" width="120" height="30" fill="var(--accent-color)" opacity="0.4" />
                    <path class="tank-water" d="M 520 260 Q 550 255 580 260 T 640 260" fill="none" stroke="var(--accent-color)" stroke-width="2" filter="url(#water-glow)"/>

                    <!-- Falling Water Droplets -->
                    <g class="falling-water">
                        <line x1="580" y1="205" x2="580" y2="235" stroke="var(--accent-color)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" filter="url(#water-glow)" />
                    </g>

                    <!-- Scientific HUD Text -->
                    <g transform="translate(800, 130)" opacity="0.8">
                        <text x="0" y="0" fill="var(--text-dark)" font-family="monospace" font-weight="bold" font-size="14">P = mgh / t</text>
                        <text x="0" y="20" fill="var(--primary-color)" font-family="monospace" font-weight="bold" font-size="12">W = ∫F·ds</text>
                    </g>
                </svg>
            </div>

            <div class="container relative z-10">
                <div class="ch5-subtitle bn-text"><i data-lucide="zap"></i> অধ্যায় ০৫</div>
                <h1 class="ch5-title bn-text">কাজ, শক্তি ও ক্ষমতা</h1>
                <p class="bn-text ch5-hero-desc">
                    ইঞ্জিনের ক্ষমতা, কুয়া বা চৌবাচ্চা খালি করা, স্প্রিংয়ের সঞ্চিত শক্তি এবং কাজ-শক্তি উপপাদ্যের গাণিতিক বিশ্লেষণ।
                </p>
            </div>
        </section>

        <section class="container" style="min-height: 60vh;">
            <div class="tab-container">
                <div class="tabs">
                    <button class="tab-btn active bn-text" data-tab="tab-formulas">
                        <i data-lucide="sigma"></i> প্রয়োজনীয় সূত্রাবলি
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-mcq">
                        <i data-lucide="check-square"></i> ডাইনামিক MCQ
                    </button>
                    <button class="tab-btn bn-text" data-tab="tab-cq">
                        <i data-lucide="pen-tool"></i> সৃজনশীল প্রশ্ন (CQ)
                    </button>
                </div>

                <!-- TAB 1: FORMULAS -->
                <div id="tab-formulas" class="tab-content active">
                    <div id="formula-container" class="formula-grid">
                        <div style="text-align:center; padding: 20px; width: 100%;">লোড হচ্ছে...</div>
                    </div>
                </div>

                <!-- TAB 2: DYNAMIC MCQ -->
                <div id="tab-mcq" class="tab-content">
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="mcq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="mcq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="mcq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="layers"></i> প্রশ্নের ধরন</label>
                                <select id="mcq-type-filter">
                                    <option value="all">সকল প্রশ্ন</option>
                                    <option value="static">বইয়ের প্রশ্ন</option>
                                    <option value="dynamic">মান পরিবর্তনশীল</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="book-open"></i> লার্নিং মোড</label>
                                <select id="mcq-mode-select">
                                    <option value="practice">প্র্যাকটিস মোড</option>
                                    <option value="teach">টিচিং মোড</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="list-ordered"></i> প্রশ্নের সিরিয়াল</label>
                                <select id="mcq-serial-select">
                                    <option value="json">বইয়ের সিরিয়াল</option>
                                    <option value="random">এলোমেলো</option>
                                </select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="eye"></i> উত্তর প্রদর্শন</label>
                                <select id="mcq-answer-select">
                                    <option value="hide">ক্লিক করার পর দেখান</option>
                                    <option value="show">সব উত্তর আগেই দেখান</option>
                                </select>
                            </div>
                        </div>
                        <div class="mcq-controls">
                            <button id="regen-mcq-btn" class="action-btn bn-text">
                                <i data-lucide="refresh-cw"></i> নতুন সেট তৈরি করুন
                            </button>
                        </div>
                    </div>
                    <div id="dynamic-mcq-container"></div>
                </div>

                <!-- TAB 3: CQ -->
                <div id="tab-cq" class="tab-content">
                    <div class="cq-sub-tabs">
                        <button class="cq-sub-tab-btn active bn-text" data-cq="ka">জ্ঞানমূলক (ক)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="kha">অনুধাবনমূলক (খ)</button>
                        <button class="cq-sub-tab-btn bn-text" data-cq="ga-gha">প্রয়োগ ও উচ্চতর (গ, ঘ)</button>
                    </div>
                    <div class="mcq-settings-panel">
                        <div class="settings-grid">
                            <div class="setting-group" style="grid-column: 1 / -1;">
                                <label><i data-lucide="search"></i> অনুসন্ধান</label>
                                <input type="text" id="cq-search" class="search-input" placeholder="সার্চ করুন...">
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="filter"></i> বোর্ড ফিল্টার</label>
                                <select id="cq-board-filter"><option value="all">সকল বোর্ড</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="calendar"></i> সাল ফিল্টার</label>
                                <select id="cq-year-filter"><option value="all">সকল সাল</option></select>
                            </div>
                            <div class="setting-group">
                                <label><i data-lucide="tag"></i> টপিক ফিল্টার</label>
                                <select id="cq-type-filter"><option value="all">সকল টপিক</option></select>
                            </div>
                        </div>
                    </div>
                    <div id="cq-container">
                        <div style="text-align:center; padding: 20px;">লোড হচ্ছে...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="scroll-fab-container" id="scroll-controls">
        <button class="scroll-fab" id="scroll-top-btn" title="উপরে যান"><i data-lucide="arrow-up"></i></button>
        <button class="scroll-fab" id="scroll-bottom-btn" title="নিচে যান"><i data-lucide="arrow-down"></i></button>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/include-navbar.js"></script>
    <script src="../js/include-footer.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    
    <script src="../topic-js/topic-main.js"></script>
    <script src="../topic-data/ch5/scripts/mcq-generator.js"></script>
    <script src="../topic-data/shared/mcq-function.js"></script>
    <script src="../topic-data/shared/cq-function.js"></script>
</body>
</html>
